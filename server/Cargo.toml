[package]
name = "bad-spaceship-server"
version = "0.1.0"
authors = ["Sam Carey <sam@samcarey.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bad-spaceship-shared = { path = "../shared" }
bevy = { version = "0.19", default-features = false }
# Avian replaces bevy_rapier3d (see shared/Cargo.toml). The headless server only
# runs the shared simulation, but declares Avian directly to turn on the perf
# features below; `default-features = false` keeps the render-pulling `debug-plugin`
# out of the headless build. `xpbd_joints` is re-added so the joint solver runs.
avian3d = { version = "0.7.0", default-features = false, features = ["3d", "f32", "parry-f32", "xpbd_joints"] }

[features]
default = [
    # Avian perf features (rapier's `simd-stable`/`parallel` equivalents).
    "avian3d/simd",
    "avian3d/parallel",
    # Hot-reload of RON config assets (watch_for_changes). The file watcher needs
    # the `multi_threaded` feature on to function.
    "bevy/file_watcher",
    "bevy/multi_threaded",
]
