[package]
name = "bad-spaceship-server"
version = "0.1.0"
authors = ["Sam Carey <sam@samcarey.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bad-spaceship-shared = { path = "../shared" }
bevy = { version = "0.5.0", default-features = false }
bevy_rapier3d = "0.11.0"

[features]
default = ["bevy_rapier3d/simd-stable", "bevy_rapier3d/parallel"]
