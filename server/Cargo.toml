[package]
name = "bad-spaceship-server"
version = "0.1.0"
authors = ["Sam Carey <sam@samcarey.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bad-spaceship-shared = { path = "../shared" }
# Version + base features inherited from `[workspace.dependencies]` (root Cargo.toml).
bevy = { workspace = true }
# Avian replaces bevy_rapier3d (see shared/Cargo.toml). The headless server only
# runs the shared simulation; it declares Avian directly to turn on the perf
# features in `[features]` below (the workspace pin's `default-features = false`
# keeps the render-pulling `debug-plugin` out of the headless build).
avian3d = { workspace = true }
# Server-side netcode: the dedicated authoritative host. `server` runtime group +
# WebSocket transport (browsers connect over WSS) + netcode connection layer +
# replication. Version pinned in the root `[workspace.dependencies]`.
lightyear = { workspace = true, features = ["server", "replication", "prediction", "interpolation", "websocket", "netcode", "std", "input_native"] }
lightyear_avian3d = { workspace = true }

[features]
default = [
    # NB: `avian3d/simd` + `avian3d/parallel` were removed for cross-platform
    # determinism — they're incompatible with the workspace's `enhanced-determinism`
    # (SIMD width + parallel solver reduction order are non-deterministic), and the
    # server must compute bit-for-bit what the wasm client predicts or every divergence
    # is a client rollback. The single-threaded scalar solver is ample for the server's
    # load (a few rooms × ~10 parts on an M4). `bevy/multi_threaded` stays (it's for the
    # file watcher / Bevy's system scheduler, independent of Avian's physics threading).
    # Hot-reload of RON config assets (watch_for_changes). The file watcher needs
    # the `multi_threaded` feature on to function.
    "bevy/file_watcher",
    "bevy/multi_threaded",
    # lightyear uses Bevy states internally; the headless server (MinimalPlugins)
    # must add StatesPlugin, which needs the `bevy_state` crate/feature compiled in.
    "bevy/bevy_state",
]
