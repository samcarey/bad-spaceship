image: python:3.8-buster

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

pages:
  stage: deploy
  script:
    - pip install -r requirements.txt
    - mkdocs build --strict --verbose --site-dir public --config-file mkdocs.yml
  artifacts:
    paths:
      - public
  rules:
    - changes:
      - mkdocs.yml
      - docs/*

