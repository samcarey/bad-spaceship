image: registry.gitlab.com/nobo-games/docker-ci-image

pages:
  stage: deploy
  script:
    - cd bevy && cargo make build-web && cd .. && cp bevy/target/{wasm_bg.wasm,wasm.js} docs/demo/
    - mkdocs build --strict --verbose --site-dir public --config-file mkdocs.yml
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

