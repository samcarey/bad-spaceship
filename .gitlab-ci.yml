image: rust:1.48

pages:
  stage: deploy
  script:
    - apt update && sudo apt upgrade -y && apt install -y curl
    - curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - cargo install cargo-make
    - rustup target add wasm32-unknown-unknown
    - cd bevy && cargo make build-web
    - pip install -r requirements.txt
    - mkdocs build --strict --verbose --site-dir public --config-file mkdocs.yml
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "ci"'
      # changes:
      # - mkdocs.yml
      # - docs/*

