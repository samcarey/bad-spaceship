image: ubuntu:20.04

pages:
  stage: deploy
  script:
    - curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    - cd bevy && cargo make build-web
    - pip install -r requirements.txt
    - mkdocs build --strict --verbose --site-dir public --config-file mkdocs.yml
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "ci"'
      # changes:
      # - mkdocs.yml
      # - docs/*

