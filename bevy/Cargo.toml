[package]
name = "bad-spaceship-bevy"
version = "0.1.0"
authors = ["Sam Carey <sam@samcarey.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# External
# bevy = "0.4.0"
serde = { version = "1.0.118", features = ["derive"] }
ron = "0.6.2"
nalgebra = "0.23.1"
bevy_rapier3d = { version = "0.7.0", features = ["simd-stable", "parallel"] }
rapier3d = "0.4.2"
bevy_networking_turbulence = {git = "https://github.com/smokku/bevy_networking_turbulence", rev="1bfe6f44397e510009a8a80abad1e105d875bf94"}
simple_logger = "1"
rand = "0.8"
log = "0.4"
cfg-if = "1.0.0"
include_dir = "0.6.0"

bevy = {version="0.4.0", default-features=false}
bevy_webgl2 = {version="0.4.0", optional=true}
winit = {version = "0.24.0"}

[profile.dev]
opt-level = 0
debug = 2

[features]
default = [
  "bevy/bevy_gltf",
  "bevy/bevy_winit",
  "bevy/render",
  "bevy/png",
]

native = [
  "bevy/bevy_wgpu",
]

web = [
  "bevy_webgl2"
]
