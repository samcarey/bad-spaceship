[workspace]
members = ["client", "server", "shared", "matchmaker", "buoyancy", "bot"]
resolver = "2"

# ─────────────────────────────────────────────────────────────────────────────
# Centralized engine version pins (the "easy upgrade" knob).
#
# Every engine-coupled crate's version is declared ONCE here and inherited by the
# member crates via `{ workspace = true }`. Per-crate *feature* selection still
# lives in each member's Cargo.toml (the feature sets differ — the client pulls
# the renderer, the server is headless, etc.); only the version + the shared base
# settings are centralized.
#
# ENGINE VERSION: Bevy 0.19 (with lightyear 0.28 for multiplayer).
# The repo was held at Bevy 0.18 for a while because the netcode stack (`lightyear`)
# had no 0.19-compatible release; lightyear 0.28 (→ bevy ^0.19, aeronet_io ^0.21,
# bevy_replicon 0.41, avian3d ^0.7) shipped that support and we re-bumped to 0.19.
# lightyear 0.27→0.28 needed ZERO code changes; the 0.18→0.19 bump needed only three
# small fixes (see the "Bevy 0.19 migration gotchas" section in CLAUDE.md).
#
# HOW TO DO THE NEXT ENGINE BUMP (the pattern that worked here):
#   1. In THIS block, bump bevy + avian3d + bevy_egui + lightyear together to the
#      releases that target the new Bevy (check each crate's `bevy` req on crates.io).
#   2. `rm Cargo.lock && cargo generate-lockfile` (the prescribed move on a Bevy
#      bump: single engine in the graph, no duplicate Bevy), then build & fix.
#   3. Bump `RUST_TOOLCHAIN`/`WASM_BINDGEN_VERSION` notes in pages.yml only if the
#      regenerated lock moves wasm-bindgen (0.18/0.19 both resolve 0.2.125).
# ─────────────────────────────────────────────────────────────────────────────
[workspace.dependencies]
bevy = { version = "0.19", default-features = false }
# Avian (XPBD physics). 0.7.0 is the release that targets Bevy 0.19 (parry3d 0.27).
# Only the minimal common base lives here (workspace features are additive, so
# members can't subtract them): `shared` adds `xpbd_joints` (joint solver) +
# `serialize` (needed to replicate Position/Rotation) for the game crates, and
# native/server re-add `simd`/`parallel` for perf; the size-sensitive `buoyancy`
# wasm build takes just this base. See shared/Cargo.toml for the full rationale.
avian3d = { version = "0.7.0", default-features = false, features = ["3d", "f32", "parry-f32"] }
# bevy_egui 0.40 is the release that targets Bevy 0.19 (egui 0.34). Client-only,
# but pinned here so all engine-coupled versions live in one place. Workspace
# features are additive (members can't subtract them), so only the universally
# needed `render` lives here; `default_fonts` (1.4 MB of embedded fonts) is
# opted into by the client, while wasm-size-sensitive `buoyancy` ships tiny
# subset fonts instead (buoyancy/fonts/).
bevy_egui = { version = "0.40", default-features = false, features = ["render"] }
# Multiplayer netcode. 0.28 is the release that targets Bevy 0.19 (it requires
# bevy_app/bevy_ecs ^0.19, aeronet_io ^0.21, avian3d ^0.7). `default-features
# = false` so each crate opts into only what it needs: `shared` takes the
# protocol-building features (no client/server runtime), the client takes
# `client` + browser transports, the server takes `server` + transports.
lightyear = { version = "0.28", default-features = false }
# Avian↔lightyear integration: networks Avian's `Position`/`Rotation` with
# client-side prediction + rollback (and pulls `lightyear_replication/avian3d`,
# which makes those components replicable). Added manually to the client & server
# net plugins (it is NOT part of Client/ServerPlugins); the protocol registers
# Position/Rotation in `shared`. State-replication mode, so no `deterministic`.
lightyear_avian3d = { version = "0.28", default-features = false, features = ["3d", "f32", "std"] }
# Wasm-size lever, not a behavior need: the `release_max_level_warn` feature is
# a *static* cap — in release builds every info!/debug!/trace! call site across
# the whole graph (mostly Bevy's) compiles out, format strings and all;
# warnings/errors still reach the console. Pinned here so the two crates that
# pull it (buoyancy unconditionally, the client wasm-only) can't drift.
tracing = { version = "0.1", default-features = false, features = ["release_max_level_warn"] }

# Recommended for rapier: https://rapier.rs/docs/user_guides/bevy_plugin/common_mistakes
[profile.dev.package."*"]
opt-level = 3

# Recommended for rapier: https://rapier.rs/docs/user_guides/bevy_plugin/common_mistakes
[profile.release]
codegen-units = 1

# Published-wasm profile: maximum size reduction. Separate from `release` so
# the fast demo-iteration loop doesn't pay the fat-LTO link time on every
# rebuild. (`panic = "abort"` is near-free on wasm32 — the target can't unwind
# anyway — and drops all landing-pad code; the console panic hook still runs.)
[profile.wasm-dist]
inherits = "release"
opt-level = "z"
lto = "fat"
strip = true
panic = "abort"

# avian3d 0.7.0 + the tolerant-island patch (samcarey/avian fork of Jondolf/avian
# at the v0.7.0 tag). Avian's island manager panicked on a dangling contact link
# — `remove_contact` unwrapping a neighbor edge that was already removed from the
# contact graph (armed when `JointCollisionDisabled` lands on a pair that already
# has a live contact, which the multiplayer client can't avoid: replication
# delivers parts before their joints). On Wasm (panic=abort) that froze the whole
# game seconds after standing on a clamped rocket pad — 100% reproducible on
# WebKit via headless Playwright. Drop this patch when upstream fixes it
# (Jondolf/avian#950 family).
[patch.crates-io]
avian3d = { git = "https://github.com/samcarey/avian", rev = "e87387c9540ad4fb8567ccf5d2ad144c204c419e" }
