[package]
name = "bad-spaceship-bevy"
version = "0.1.9"
authors = ["Sam Carey <sam@samcarey.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = { version="0.5.0", default-features=false }
bevy_rapier3d = "0.10.2"
serde = { version = "1.0.126", features = ["derive"] }
ron = "0.6.4"
nalgebra = "0.28.0"
log = "0.4.14"
rand = "0.8.4"
bevy_webgl2 = {version="0.5.2", optional = true}
include_dir = {version="0.6.1", optional = true}
winit = {version = "0.25.0"}
gloo = {version = "0.3.0", optional = true}
web-sys = {version = "0.3.40", optional = true}
bevy_web_fullscreen = {git="https://github.com/ostwilkens/bevy_web_fullscreen", rev="b363df1ee60f948e99dbf5ad71d489066d80b052"}
bevy_egui = "0.6.1"

once_cell = "1.8.0"

[features]
default = [
  "bevy/bevy_gltf",
  "bevy/bevy_winit",
  "bevy/render",
]

native = [
  "bevy_rapier3d/simd-stable",
  "bevy/bevy_wgpu",
  "bevy_rapier3d/parallel",
  "bevy/bevy_gilrs"
]

web = [
  "bevy_webgl2",
  "include_dir",
  "web-sys",
  "gloo",
  "winit/web-sys",
]

# Recommended for rapier: https://rapier.rs/docs/user_guides/bevy_plugin/common_mistakes
[profile.dev.package.bevy_rapier3d]
opt-level = 3

# Recommended for rapier: https://rapier.rs/docs/user_guides/bevy_plugin/common_mistakes
[profile.release]
codegen-units = 1