[workspace]
members = ["client", "server", "shared"]
resolver = "2"

# ─────────────────────────────────────────────────────────────────────────────
# Centralized engine version pins (the "easy upgrade" knob).
#
# Every engine-coupled crate's version is declared ONCE here and inherited by the
# member crates via `{ workspace = true }`. Per-crate *feature* selection still
# lives in each member's Cargo.toml (the feature sets differ — the client pulls
# the renderer, the server is headless, etc.); only the version + the shared base
# settings are centralized.
#
# WHY WE ARE ON BEVY 0.18 (not 0.19):
# The repo briefly ran on Bevy 0.19 (commit #35), but multiplayer needs `lightyear`,
# and as of this writing lightyear (and the rest of the Bevy netcode ecosystem)
# targets Bevy 0.18 — 0.19 support is expected to land within a few weeks of the
# 0.19 engine release. We deliberately stepped the engine back to 0.18 so the
# netcode stack builds, structured so the re-bump to 0.19 is a near-trivial edit.
#
# HOW TO UPGRADE BACK TO 0.19 once lightyear ships a 0.19-compatible release:
#   1. In THIS block, bump:  bevy 0.18→0.19,  avian3d 0.6.1→0.7.0,
#      bevy_egui 0.39→0.40,  and lightyear → its 0.19 release.
#   2. Re-apply the two code changes the downgrade reversed (see the "Bevy 0.19
#      migration gotchas" section in CLAUDE.md — they're the canonical list):
#        • client/src/render_main_pass.rs: DirectionalLight `shadows_enabled`
#          → `shadow_maps_enabled`.
#        • client/src/ui.rs: `update_ui_scale_factor` back to egui's per-context
#          zoom factor (drop the `EguiContextSettings::scale_factor` query, move
#          the system into `EguiPrimaryContextPass`, make it fallible).
#   3. `rm Cargo.lock && cargo generate-lockfile` (the prescribed move on a Bevy
#      bump: single engine in the graph, no duplicate Bevy).
#   4. Bump `RUST_TOOLCHAIN`/`WASM_BINDGEN_VERSION` notes in pages.yml only if the
#      regenerated lock moves wasm-bindgen (0.18 and 0.19 both resolve 0.2.125).
# ─────────────────────────────────────────────────────────────────────────────
[workspace.dependencies]
bevy = { version = "0.18", default-features = false }
# Avian (XPBD physics). 0.6.1 is the release that targets Bevy 0.18 (parry3d 0.26).
# The base feature set is identical across all three crates; native/server re-add
# `avian3d/simd` + `avian3d/parallel` via their own `[features]` lists. See
# shared/Cargo.toml for the full rationale on each base feature (esp. xpbd_joints).
avian3d = { version = "0.6.1", default-features = false, features = ["3d", "f32", "parry-f32", "xpbd_joints"] }
# bevy_egui 0.39 is the release that targets Bevy 0.18 (egui 0.31). Client-only,
# but pinned here so all engine-coupled versions live in one place.
bevy_egui = { version = "0.39", default-features = false, features = ["default_fonts", "render"] }
# Multiplayer netcode. 0.27 is the release that targets Bevy 0.18 (this is the
# whole reason the engine is held at 0.18 — see the note above). `default-features
# = false` so each crate opts into only what it needs: `shared` takes the
# protocol-building features (no client/server runtime), the client takes
# `client` + browser transports, the server takes `server` + transports. Bump to
# the 0.19-compatible lightyear release as step 1 of the 0.19 re-upgrade.
lightyear = { version = "0.27", default-features = false }

# Recommended for rapier: https://rapier.rs/docs/user_guides/bevy_plugin/common_mistakes
[profile.dev.package."*"]
opt-level = 3

# Recommended for rapier: https://rapier.rs/docs/user_guides/bevy_plugin/common_mistakes
[profile.release]
codegen-units = 1
