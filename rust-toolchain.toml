# Pinned toolchain for reproducible builds of this Bevy 0.18 (2026-era) project.
# (Temporarily on 0.18 — not 0.19 — so the `lightyear` netcode stack builds; see
# the `[workspace.dependencies]` block in the root Cargo.toml for the rationale and
# the 0.19 re-upgrade checklist.) Bevy 0.18 / wgpu 27 build with a version-matched
# `wasm-bindgen` CLI (see `.github/workflows/pages.yml`). Bevy 0.18's MSRV is 1.89;
# the 1.96 pin sits comfortably above it (and above 0.19's 1.95, so it survives the
# re-upgrade unchanged). Keep this and `RUST_TOOLCHAIN` in pages.yml in lockstep.
[toolchain]
channel = "1.96.0"
targets = ["wasm32-unknown-unknown"]
