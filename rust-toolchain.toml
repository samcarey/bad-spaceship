# Pinned toolchain for reproducible builds of this Bevy 0.15 (2024-era) project.
# Bevy 0.15 / wgpu 23 build with the version-matched `wasm-bindgen` 0.2.97.
# Bevy 0.15's MSRV is Rust 1.82.0, so the toolchain is held at 1.82.0; several
# transitive deps are still pinned back in Cargo.lock to pre-edition-2024 releases
# (see CLAUDE.md) so they keep building on it — anything needing edition 2024
# (a Cargo >= 1.85 nightly to even parse) stays pinned back.
[toolchain]
channel = "1.82.0"
targets = ["wasm32-unknown-unknown"]
