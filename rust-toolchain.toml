# Pinned toolchain for reproducible builds of this Bevy 0.16 (2025-era) project.
# Bevy 0.16 / wgpu 24 build with a version-matched `wasm-bindgen` CLI (see
# `.github/workflows/pages.yml`). Bevy 0.16's MSRV is Rust 1.85.0, the first
# stable to ship edition 2024 — so the old 1.82-era edition-2024 dependency pins
# (indexmap/proc-macro-crate/image/blake3/… in CLAUDE.md) are no longer needed and
# have been dropped; the graph resolves forward freely now.
[toolchain]
channel = "1.85.0"
targets = ["wasm32-unknown-unknown"]
