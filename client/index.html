<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bad Spaceship</title>
  <!-- Static landing page. Deliberately WASM-free so it paints instantly; the
       heavy game binary is only downloaded once you pick a mode (play.html). -->
  <style>
    :root {
      --bg: #05070d;
      --panel: #0b1322;
      --accent: #7fb3ff;
      --accent-strong: #2f6fd0;
      --border: #28466f;
      --text: #cde3ff;
      --muted: #6f86a8;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: radial-gradient(circle at 50% 30%, #0a1426 0%, var(--bg) 70%);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.4rem;
      padding: 1.5rem;
      box-sizing: border-box;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 6vw, 3rem);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--accent);
      text-align: center;
    }

    .tagline {
      margin: -1.4rem 0 0;
      color: var(--muted);
      font-size: 0.9rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: min(86vw, 340px);
    }

    .btn {
      appearance: none;
      cursor: pointer;
      font: inherit;
      text-decoration: none;
      text-align: center;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.2rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.05s ease;
    }

    .btn:hover {
      border-color: var(--accent);
      background: #10203a;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.primary {
      background: linear-gradient(90deg, var(--accent-strong), var(--accent));
      border-color: transparent;
      color: #04101f;
      font-weight: 600;
    }

    .btn .sub {
      display: block;
      margin-top: 0.35rem;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: none;
      color: var(--muted);
    }

    .btn.primary .sub {
      color: #0a2440;
    }

    footer {
      position: fixed;
      bottom: 0.8rem;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
    }
  </style>
</head>

<body>
  <h1>Bad Spaceship</h1>
  <p class="tagline">build · attach · fly</p>

  <nav class="menu">
    <a class="btn primary" href="play.html">
      Single Player
      <span class="sub">Launch the game offline — instant, no server</span>
    </a>
    <a class="btn" href="lobby.html">
      Multiplayer
      <span class="sub">Browse lobbies, create a match, or join by link</span>
    </a>
  </nav>

  <footer>v0.1 · WebGL2</footer>
</body>

</html>
