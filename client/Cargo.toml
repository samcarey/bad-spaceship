[package]
name = "bad-spaceship-client"
version = "0.1.0"
authors = ["Sam Carey <sam@samcarey.com>"]
edition = "2021"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = { version = "0.14", default-features = false }
bevy_rapier3d = "0.27"
serde = { version = "1.0", features = ["derive"] }
nalgebra = "0.32"
log = "0.4"
gloo = { version = "0.7", optional = true }
web-sys = { version = "0.3.40", optional = true }
# Disable bevy_egui's clipboard/hyperlink extras (the menu uses neither); this
# drops the arboard→image and webbrowser→home native dep chains. Keep fonts, and
# keep `render` — bevy_egui 0.28 gates *all* egui drawing behind it (0.23 had no
# such feature), so dropping it silently hides every egui panel/menu.
bevy_egui = { version = "0.28", default-features = false, features = ["default_fonts", "render"] }
bad-spaceship-shared = { path = "../shared" }
shadow-rs = { version = "0.11", default-features = false }
chrono = "0.4"
rand = "0.8"
wasm-bindgen = "=0.2.92"

once_cell = "1.8"

[features]
# Bevy 0.10 dropped the umbrella `render` feature (still gone in 0.12); pull the
# renderer in via bevy_pbr (3D/lighting) + bevy_core_pipeline, plus glTF and winit.
default = [
    "bevy/bevy_gltf",
    "bevy/bevy_winit",
    "bevy/bevy_pbr",
    "bevy/bevy_core_pipeline",
    # Bevy 0.14 extracted the state machine into a separate `bevy_state` crate
    # gated behind this feature; with `default-features = false` it must be
    # re-enabled or `init_state`/`NextState`/`OnEnter` disappear.
    "bevy/bevy_state",
]

native = [
    "bevy_rapier3d/simd-stable",
    "bevy_rapier3d/parallel",
    "bevy/bevy_gilrs",
    # winit needs a windowing backend on Linux (was implied by the old `render`
    # umbrella feature, dropped in 0.10).
    "bevy/x11",
    # Hot-reload of RON config assets (watch_for_changes); native-only so the
    # wasm build doesn't pull in the `notify` filesystem watcher. Bevy 0.14
    # requires `multi_threaded` for the file watcher to function (the feature was
    # renamed from 0.13's hyphenated `multi-threaded` to use an underscore).
    "bevy/file_watcher",
    "bevy/multi_threaded",
]

# Bevy 0.14's wgpu 0.20 compiles the WebGPU backend on wasm by default (which
# needs `--cfg=web_sys_unstable_apis` and only works in WebGPU-capable browsers).
# Enable WebGL2 so wgpu builds the GLES backend instead — broad browser support,
# matching the renderer the 0.10/wgpu 0.15 build used on GitHub Pages.
web = ["web-sys", "gloo", "bevy/webgl2"]

[build-dependencies]
shadow-rs = { version = "0.8", default-features = false }
