[package]
name = "bad-spaceship-client"
version = "0.1.0"
authors = ["Sam Carey <sam@samcarey.com>"]
edition = "2021"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Version + base features inherited from `[workspace.dependencies]` (root Cargo.toml,
# the single place engine versions are pinned). Renderer/winit/etc. features are
# selected per-target in this crate's `[features]` below.
bevy = { workspace = true }
# Avian replaces bevy_rapier3d (see shared/Cargo.toml for the feature rationale).
# The client only needs collider introspection for building render meshes, so the
# workspace base feature set applies (including `xpbd_joints` so the joint solver is
# compiled into the native binary); `native` adds the perf features.
avian3d = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
gloo = { version = "0.7", optional = true }
web-sys = { version = "0.3.40", optional = true }
# Version + features inherited from `[workspace.dependencies]` (root Cargo.toml).
# That pin disables bevy_egui's clipboard/hyperlink extras (the menu uses neither;
# drops the arboard→image and webbrowser→home native dep chains) while keeping
# `default_fonts` and `render` — bevy_egui gates *all* egui drawing behind `render`,
# so dropping it silently hides every egui panel/menu.
bevy_egui = { workspace = true }
bad-spaceship-shared = { path = "../shared" }
# Bevy 0.17's wasm build needs getrandom 0.3's `wasm_js` backend explicitly
# selected (it dropped the implicit wasm fallback). The backend cfg is set for
# the wasm target in `.cargo/config.toml`; this enables the matching feature.
getrandom = { version = "0.3", features = ["wasm_js"], optional = true }
# `rand 0.8` (used by client + shared) pulls getrandom *0.2* transitively, a
# separate line from the 0.3 above. On wasm it needs its `js` backend feature
# (the 0.3 `wasm_js` cfg doesn't apply to 0.2); enabling it here unifies the
# feature across the graph so the transitive 0.2 builds for wasm.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"], optional = true }
# `lightyear` (multiplayer) pulls getrandom *0.4* transitively — a third major
# line alongside 0.2 and 0.3. Like 0.3 it needs the `getrandom_backend="wasm_js"`
# cfg (set globally for the wasm target in `.cargo/config.toml`) *and* the
# matching `wasm_js` feature; enable it here and unify it into the `web` feature.
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"], optional = true }
shadow-rs = { version = "0.11", default-features = false }
chrono = "0.4"
rand = "0.8"
wasm-bindgen = "=0.2.125"

once_cell = "1.8"

[features]
# Bevy 0.10 dropped the umbrella `render` feature (still gone in 0.12); pull the
# renderer in via bevy_pbr (3D/lighting) + bevy_core_pipeline, plus glTF and winit.
default = [
    "bevy/bevy_gltf",
    "bevy/bevy_winit",
    "bevy/bevy_pbr",
    "bevy/bevy_core_pipeline",
    # The state machine lives in a separate `bevy_state` crate gated behind this
    # feature; with `default-features = false` it must be re-enabled or
    # `init_state`/`NextState`/`OnEnter` disappear.
    "bevy/bevy_state",
    # Bevy 0.16 gates the `bevy::log` re-export behind this feature; without it the
    # `bevy::log::info!` calls in the pause menu fail to resolve. (It was implicitly
    # present under 0.15.)
    "bevy/bevy_log",
    # Bevy 0.18 split `bevy_input`'s sources behind features. Unlike keyboard/mouse
    # (auto-enabled by `bevy_winit`), nothing in the graph pulls `touch` — so without
    # this the `Touches` resource is never inserted and `touch_screen_input_system`
    # never runs, and `mobile.rs`'s `Res<Touches>` reads a non-existent resource at
    # runtime (the touch *module* is ungated, so it still compiles — which is why a
    # compile-only check missed it). The mobile touch controls need this on every
    # build, hence `default`, not just `web`.
    "bevy/touch",
]

native = [
    # Avian perf features (rapier's `simd-stable`/`parallel` equivalents). `parallel`
    # pulls `bevy/multi_threaded`, which the file watcher below also needs.
    "avian3d/simd",
    "avian3d/parallel",
    "bevy/bevy_gilrs",
    # winit needs a windowing backend on Linux (was implied by the old `render`
    # umbrella feature, dropped in 0.10).
    "bevy/x11",
    # Hot-reload of RON config assets (watch_for_changes); native-only so the
    # wasm build doesn't pull in the `notify` filesystem watcher. Bevy 0.14
    # requires `multi_threaded` for the file watcher to function (the feature was
    # renamed from 0.13's hyphenated `multi-threaded` to use an underscore).
    "bevy/file_watcher",
    "bevy/multi_threaded",
]

# Bevy 0.15's wgpu 23 compiles the WebGPU backend on wasm by default (which
# needs `--cfg=web_sys_unstable_apis` and only works in WebGPU-capable browsers).
# Enable WebGL2 so wgpu builds the GLES backend instead — broad browser support,
# matching the renderer the build has used on GitHub Pages all along.
web = ["web-sys", "gloo", "bevy/webgl2", "getrandom", "getrandom_02", "getrandom_04"]

[build-dependencies]
shadow-rs = { version = "0.8", default-features = false }
