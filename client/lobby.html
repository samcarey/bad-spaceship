<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bad Spaceship · Multiplayer</title>
  <!-- Static lobby browser. Talks to the matchmaker service via fetch(); no
       WASM is loaded until you actually enter a game (play.html). -->
  <style>
    :root {
      --bg: #05070d;
      --panel: #0b1322;
      --panel2: #10203a;
      --accent: #7fb3ff;
      --accent-strong: #2f6fd0;
      --border: #28466f;
      --text: #cde3ff;
      --muted: #6f86a8;
      --danger: #ff5d5d;
      --ok: #5ad18a;
    }

    html, body { height: 100%; margin: 0; }

    body {
      background: radial-gradient(circle at 50% 0%, #0a1426 0%, var(--bg) 70%);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      padding: 1.2rem;
      box-sizing: border-box;
      max-width: 760px;
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.2rem;
    }

    h1 {
      font-size: 1.3rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0;
    }

    a.back {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
    }
    a.back:hover { color: var(--accent); }

    .status {
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 1rem;
      min-height: 1.1em;
    }
    .status.err { color: var(--danger); }
    .status.ok { color: var(--ok); }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      margin-bottom: 1.4rem;
    }

    input[type="text"] {
      font: inherit;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      width: 9rem;
    }
    input[type="text"]::placeholder { color: var(--muted); text-transform: none; letter-spacing: 0.04em; }

    .btn {
      appearance: none;
      cursor: pointer;
      font: inherit;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: border-color 0.15s, background 0.15s, transform 0.05s;
    }
    .btn:hover:not(:disabled) { border-color: var(--accent); background: var(--panel2); }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn.primary {
      background: linear-gradient(90deg, var(--accent-strong), var(--accent));
      border-color: transparent;
      color: #04101f;
      font-weight: 600;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.8rem 1rem;
      margin-bottom: 0.6rem;
    }
    .row .name { flex: 1; min-width: 0; }
    .row .name b { display: block; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .name small { color: var(--muted); font-size: 0.74rem; letter-spacing: 0.08em; }
    .row .count { color: var(--muted); font-size: 0.82rem; white-space: nowrap; }

    .empty { color: var(--muted); text-align: center; padding: 2rem 0; font-size: 0.9rem; }

    /* Matches / Saved Games tab bar. */
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.2rem;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      appearance: none;
      cursor: pointer;
      font: inherit;
      color: var(--muted);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 0.6rem 0.9rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* Save-kind badge (auto vs manual) in the saved-games rows. */
    .badge {
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.1rem 0.4rem;
      color: var(--muted);
    }
    .badge.manual { color: var(--ok); border-color: var(--ok); }

    /* Shareable-link panel shown after creating a match. */
    #share {
      display: none;
      background: var(--panel2);
      border: 1px solid var(--accent);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1.4rem;
    }
    #share.show { display: block; }
    #share .label { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.08em; margin-bottom: 0.5rem; }
    #share .linkrow { display: flex; gap: 0.5rem; }
    /* Fixed-width icon button so swapping the glyph (clipboard ↔ check) never
       resizes it and pushes the row past its container. */
    .icon-btn {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding-left: 0.8rem;
      padding-right: 0.8rem;
    }
    .icon-btn svg { display: block; }
    .icon-btn.ok { color: #4ade80; border-color: #4ade80; }
    #share input { flex: 1; width: auto; text-transform: none; letter-spacing: 0; }
    /* Enter is the primary action — give it its own full-width row below the link. */
    #share-enter { display: block; width: 100%; margin-top: 0.6rem; }
  </style>
</head>

<body>
  <header>
    <h1>Multiplayer</h1>
    <a class="back" href="index.html">← Menu</a>
  </header>

  <div id="status" class="status">Connecting to matchmaker…</div>

  <div class="tabs">
    <button class="tab active" id="tab-matches" type="button">Matches</button>
    <button class="tab" id="tab-saves" type="button">Saved Games</button>
  </div>

  <div id="share">
    <div class="label">Match created — share this link to invite players:</div>
    <div class="linkrow">
      <input id="share-link" type="text" readonly />
      <button class="btn icon-btn" id="share-copy" type="button" aria-label="Copy link" title="Copy link">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
      </button>
    </div>
    <button class="btn primary" id="share-enter">Enter</button>
  </div>

  <div id="pane-matches">
    <div class="actions">
      <button class="btn primary" id="create">Create Match</button>
    </div>
    <div id="list"></div>
  </div>

  <div id="pane-saves" style="display: none">
    <div id="saves-list"></div>
  </div>

  <script>
    // The matchmaker base URL. Resolution order:
    //   1. ?api=<url> query param (handy for testing against a local instance)
    //   2. window.BS_MATCHMAKER_URL (set this for the deployed site)
    //   3. localhost default (works out of the box for `cargo run -p ...matchmaker`)
    // GitHub Pages can't host the matchmaker, so the deployed site must point at
    // wherever it actually runs (e.g. the Mac box / a small VPS).
    const params = new URLSearchParams(location.search);
    const isLocal = /^(localhost|127\.|0\.0\.0\.0)/.test(location.hostname);
    const MATCHMAKER = (
      params.get('api') ||
      window.BS_MATCHMAKER_URL ||
      (isLocal ? 'http://localhost:5000' : 'https://game.badspaceship.com:7443')
    ).replace(/\/$/, '');

    const statusEl = document.getElementById('status');
    const listEl = document.getElementById('list');
    const shareEl = document.getElementById('share');
    const shareLink = document.getElementById('share-link');

    function setStatus(msg, kind) {
      statusEl.textContent = msg;
      statusEl.className = 'status' + (kind ? ' ' + kind : '');
    }

    function api(path, opts) {
      return fetch(MATCHMAKER + path, opts);
    }

    // The matchmaker now owns URL construction: it returns `web_url` (the
    // versioned play URL for the room's pinned game version) and `share_url` (the
    // short, version-agnostic invite link). The front-end just navigates to them.
    function enterGame(webUrl) {
      location.href = webUrl;
    }

    function ago(unix) {
      const s = Math.max(0, Math.floor(Date.now() / 1000) - unix);
      if (s < 60) return s + 's ago';
      if (s < 3600) return Math.floor(s / 60) + 'm ago';
      return Math.floor(s / 3600) + 'h ago';
    }

    function renderList(lobbies) {
      listEl.innerHTML = '';
      if (!lobbies.length) {
        const d = document.createElement('div');
        d.className = 'empty';
        d.textContent = 'No open matches yet — create one!';
        listEl.appendChild(d);
        return;
      }
      for (const m of lobbies) {
        const full = m.players >= m.max_players;
        const row = document.createElement('div');
        row.className = 'row';

        const name = document.createElement('div');
        name.className = 'name';
        const b = document.createElement('b');
        b.textContent = m.name;
        const small = document.createElement('small');
        small.textContent = 'code ' + m.id + ' · ' + ago(m.created_unix);
        name.appendChild(b);
        name.appendChild(small);

        const count = document.createElement('div');
        count.className = 'count';
        count.textContent = m.players + ' / ' + m.max_players;

        const btn = document.createElement('button');
        btn.className = 'btn primary';
        btn.textContent = full ? 'Full' : 'Join';
        btn.disabled = full;
        btn.addEventListener('click', () => joinById(m.id));

        row.appendChild(name);
        row.appendChild(count);
        row.appendChild(btn);
        listEl.appendChild(row);
      }
    }

    // ---- Saved games tab -------------------------------------------------

    let activeTab = 'matches';

    function setTab(tab) {
      activeTab = tab;
      document.getElementById('tab-matches').classList.toggle('active', tab === 'matches');
      document.getElementById('tab-saves').classList.toggle('active', tab === 'saves');
      document.getElementById('pane-matches').style.display = tab === 'matches' ? '' : 'none';
      document.getElementById('pane-saves').style.display = tab === 'saves' ? '' : 'none';
      refresh();
    }

    function renderSaves(saves) {
      const savesEl = document.getElementById('saves-list');
      savesEl.innerHTML = '';
      if (!saves.length) {
        const d = document.createElement('div');
        d.className = 'empty';
        d.textContent = 'No saved games yet — worlds autosave while you play.';
        savesEl.appendChild(d);
        return;
      }
      for (const s of saves) {
        const row = document.createElement('div');
        row.className = 'row';

        const name = document.createElement('div');
        name.className = 'name';
        const b = document.createElement('b');
        b.textContent = s.kind === 'auto' ? 'Autosave ' + s.room_code : s.name;
        const small = document.createElement('small');
        small.textContent = 'from ' + s.room_code + ' · ' + ago(s.saved_unix);
        name.appendChild(b);
        name.appendChild(small);

        const badge = document.createElement('span');
        badge.className = 'badge' + (s.kind === 'manual' ? ' manual' : '');
        badge.textContent = s.kind;

        const btn = document.createElement('button');
        btn.className = 'btn primary';
        btn.textContent = 'Load';
        btn.addEventListener('click', () => loadSave(s.file, btn));

        row.appendChild(name);
        row.appendChild(badge);
        row.appendChild(btn);
        savesEl.appendChild(row);
      }
    }

    // Load = the matchmaker creates a fresh match seeded from the save and
    // returns its play URL; entering it spawns the saved world.
    async function loadSave(file, btn) {
      btn.disabled = true;
      try {
        const r = await api('/api/saves/load', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ file }),
        });
        if (r.status === 503) {
          setStatus('Servers are updating to a new version — try again in a moment.', 'err');
          return;
        }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const { web_url } = await r.json();
        enterGame(web_url);
      } catch (e) {
        setStatus('Failed to load save: ' + e.message, 'err');
      } finally {
        btn.disabled = false;
      }
    }

    async function refresh() {
      if (activeTab === 'saves') {
        try {
          const r = await api('/api/saves');
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const saves = await r.json();
          renderSaves(saves);
          setStatus(saves.length + ' saved game' + (saves.length === 1 ? '' : 's'), 'ok');
        } catch (e) {
          setStatus(
            "Can't reach matchmaker at " + MATCHMAKER + ' — is it running? (' + e.message + ')',
            'err'
          );
        }
        return;
      }
      try {
        const r = await api('/api/matches');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const lobbies = await r.json();
        renderList(lobbies);
        setStatus(lobbies.length + ' open match' + (lobbies.length === 1 ? '' : 'es'), 'ok');
      } catch (e) {
        setStatus(
          "Can't reach matchmaker at " + MATCHMAKER + ' — is it running? (' + e.message + ')',
          'err'
        );
      }
    }

    async function createMatch() {
      try {
        // No name prompt: an empty name tells the matchmaker to auto-name the
        // room, and the room code itself is auto-generated server-side.
        const r = await api('/api/matches', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: '' }),
        });
        if (r.status === 503) {
          setStatus('Servers are updating to a new version — try again in a moment.', 'err');
          return;
        }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const { id, web_url, share_url } = await r.json();
        shareLink.value = share_url;
        shareEl.classList.add('show');
        document.getElementById('share-enter').onclick = () => enterGame(web_url);
        setStatus('Match ' + id + ' created.', 'ok');
        refresh();
      } catch (e) {
        setStatus('Failed to create match: ' + e.message, 'err');
      }
    }

    async function joinById(id) {
      id = (id || '').trim().toUpperCase();
      if (!id) return;
      try {
        const r = await api('/api/matches/' + encodeURIComponent(id) + '/join', { method: 'POST' });
        if (r.status === 404) { setStatus('No match with code ' + id + '.', 'err'); return; }
        if (r.status === 409) { setStatus('Match ' + id + ' is full.', 'err'); return; }
        if (r.status === 410) { setStatus('Match ' + id + ' ended — its game version was retired. Create a new one.', 'err'); refresh(); return; }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const lobby = await r.json();
        enterGame(lobby.web_url);
      } catch (e) {
        setStatus('Failed to join: ' + e.message, 'err');
      }
    }

    // Copy text to the clipboard, robust across browsers. The async Clipboard API
    // needs a secure context and can still reject (notably iOS Safari), so fall
    // back to selecting the input and the legacy `execCommand('copy')` — which
    // requires the field to be temporarily writable and explicitly selected.
    async function copyToClipboard(input) {
      const text = input.value;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try { await navigator.clipboard.writeText(text); return true; } catch (_) {}
      }
      try {
        const wasReadOnly = input.readOnly;
        input.readOnly = false;
        input.focus();
        input.setSelectionRange(0, text.length);
        const ok = document.execCommand('copy');
        input.readOnly = wasReadOnly;
        return ok;
      } catch (_) {
        return false;
      }
    }

    // Clipboard / check icons for the copy button. Swapping innerHTML (not the
    // button's width) keeps the link row from growing on success.
    const CLIPBOARD_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>';
    const CHECK_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

    document.getElementById('create').addEventListener('click', createMatch);
    document.getElementById('tab-matches').addEventListener('click', () => setTab('matches'));
    document.getElementById('tab-saves').addEventListener('click', () => setTab('saves'));
    document.getElementById('share-copy').addEventListener('click', async () => {
      const btn = document.getElementById('share-copy');
      if (await copyToClipboard(shareLink)) {
        btn.innerHTML = CHECK_SVG;
        btn.classList.add('ok');
        setTimeout(() => {
          btn.innerHTML = CLIPBOARD_SVG;
          btn.classList.remove('ok');
        }, 1500);
      } else {
        // Couldn't copy programmatically — leave the link selected so the user can
        // copy it by hand, and say so.
        shareLink.focus();
        shareLink.setSelectionRange(0, shareLink.value.length);
        setStatus('Press ⌘/Ctrl-C to copy the selected link.', 'err');
      }
    });

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>

</html>
