name: Deploy web build to GitHub Pages

# Mirrors the original GitLab `pages` CI job: builds the WASM client and
# publishes the playable web build. Runs on every push to master.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Permissions required by the GitHub Pages deployment action.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, without cancelling in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Toolchain is also pinned in rust-toolchain.toml; kept here for clarity.
  # Bevy 0.17 / wgpu 25 raise the MSRV past 1.85; this pins a recent stable.
  RUST_TOOLCHAIN: "1.96.0"
  # Must match the `wasm-bindgen` crate version resolved in Cargo.lock. bevy 0.17 /
  # wgpu 25's web-sys 0.3.102 still resolves wasm-bindgen 0.2.125 (the client also
  # pins `=0.2.125`), so this is unchanged from 0.16. Bump in lockstep with the lock.
  WASM_BINDGEN_VERSION: "0.2.125"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # build.rs / shadow-rs read git metadata for the in-game build hash.
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown --toolchain "$RUST_TOOLCHAIN"
          rustup override set "$RUST_TOOLCHAIN"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli (prebuilt, version-matched)
        run: |
          set -euo pipefail
          url="https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL "$url" -o /tmp/wasm-bindgen.tar.gz
          tar -xzf /tmp/wasm-bindgen.tar.gz -C /tmp
          sudo install -m755 "/tmp/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/wasm-bindgen
          wasm-bindgen --version

      - name: Build WASM client (release)
        run: >-
          cargo build --locked --manifest-path client/Cargo.toml
          --target wasm32-unknown-unknown --features web --release

      - name: Assemble site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/target
          # Generate JS bindings straight into the published target/ directory
          # (client/index.html loads `./target/wasm.js`).
          wasm-bindgen --out-dir _site/target --out-name wasm --target web --no-typescript \
            target/wasm32-unknown-unknown/release/bad-spaceship-client.wasm
          cp client/index.html _site/
          cp -r client/assets _site/assets
          # Publish any committed archive builds (e.g. the playable Bevy 0.12
          # build under legacy/v0.12) verbatim alongside the current site.
          if [ -d legacy ]; then cp -r legacy _site/legacy; fi
          # Emit the loader manifest with *uncompressed* byte sizes so the
          # loading bar reports an honest percentage/ETA even when the assets
          # are served gzip/br-compressed (Content-Length would be the
          # compressed size). Keep the URLs in sync with index.html's RESOURCES.
          wasm_bytes=$(stat -c%s _site/target/wasm_bg.wasm)
          grass_bytes=$(stat -c%s _site/assets/textures/grass.png)
          cat > _site/loader-manifest.json <<EOF
          {
            "resources": [
              { "url": "./target/wasm_bg.wasm", "bytes": $wasm_bytes },
              { "url": "./assets/textures/grass.png", "bytes": $grass_bytes }
            ]
          }
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Enables Pages on first run if it's entirely off. NOTE: this does NOT
          # convert an existing "Deploy from a branch" site to the Actions source
          # — that one-time switch must be done by hand in Settings → Pages
          # (Source → "GitHub Actions"). Until it is, GitHub's legacy Jekyll
          # build of the repo root wins and serves README.md instead of this
          # artifact. See the Deployment section of CLAUDE.md.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
