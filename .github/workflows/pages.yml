name: Deploy web build to GitHub Pages

# Mirrors the original GitLab `pages` CI job: builds the WASM client and
# publishes the playable web build. Runs on every push to master.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Permissions required by the GitHub Pages deployment action.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, without cancelling in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Toolchain is also pinned in rust-toolchain.toml; kept here for clarity.
  # Bevy 0.19's MSRV is 1.95; this pins a recent stable comfortably above it.
  # (On Bevy 0.19 + lightyear 0.28 — see the root Cargo.toml
  # `[workspace.dependencies]` block for the engine-bump pattern.)
  RUST_TOOLCHAIN: "1.96.0"
  # Must match the `wasm-bindgen` crate version resolved in Cargo.lock. bevy 0.19 /
  # wgpu 29's web-sys 0.3.102 still resolves wasm-bindgen 0.2.125 (the client also
  # pins `=0.2.125`), so this is unchanged. Bump in lockstep with the lock.
  WASM_BINDGEN_VERSION: "0.2.125"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # build.rs / shadow-rs read git metadata for the in-game build hash.
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown --toolchain "$RUST_TOOLCHAIN"
          rustup override set "$RUST_TOOLCHAIN"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli (prebuilt, version-matched)
        run: |
          set -euo pipefail
          url="https://github.com/rustwasm/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL "$url" -o /tmp/wasm-bindgen.tar.gz
          tar -xzf /tmp/wasm-bindgen.tar.gz -C /tmp
          sudo install -m755 "/tmp/wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" /usr/local/bin/wasm-bindgen
          wasm-bindgen --version

      - name: Build WASM client (release)
        run: >-
          cargo build --locked --manifest-path client/Cargo.toml
          --target wasm32-unknown-unknown --features web --release

      # Standalone buoyancy experiment — a separate crate + WASM bundle, published
      # to /buoyancy/ and reached via the unlinked /buoyancy.html. Built with the
      # size-optimized `wasm-dist` profile (fat LTO + opt-level z + strip) and
      # shrunk further below with wasm-opt: 56.7 MB (plain release) → 18.9 MB.
      - name: Build WASM buoyancy (wasm-dist)
        run: >-
          cargo build --locked --manifest-path buoyancy/Cargo.toml
          --target wasm32-unknown-unknown --profile wasm-dist

      - name: Install binaryen (wasm-opt)
        run: |
          set -euo pipefail
          url="https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz"
          curl -fsSL "$url" -o /tmp/binaryen.tar.gz
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          sudo install -m755 /tmp/binaryen-version_130/bin/wasm-opt /usr/local/bin/wasm-opt
          wasm-opt --version

      - name: Assemble site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/target
          # Generate JS bindings straight into the published target/ directory
          # (client/index.html loads `./target/wasm.js`).
          wasm-bindgen --out-dir _site/target --out-name wasm --target web --no-typescript \
            target/wasm32-unknown-unknown/release/bad-spaceship-client.wasm
          # index.html (landing), play.html (game loader), lobby.html (lobby browser).
          cp client/*.html _site/
          cp -r client/assets _site/assets
          # Buoyancy experiment: its own bundle under /buoyancy/ + the unlinked
          # loader page at /buoyancy.html (imports ./buoyancy/wasm.js).
          mkdir -p _site/buoyancy
          wasm-bindgen --out-dir _site/buoyancy --out-name wasm --target web --no-typescript \
            target/wasm32-unknown-unknown/wasm-dist/bad-spaceship-buoyancy.wasm
          # Binaryen size pass (~30% on top of the compiler's output). The
          # --enable-* list is exactly rustc's post-MVP ops (plain -Oz rejects
          # them) plus gc + tail-call, which binaryen uses for ~3 MB of extra
          # shrink and every stable browser ships. NEVER --all-features: it
          # lets binaryen emit experimental "exact" heap types
          # (custom-descriptors) that fail WebAssembly.compile in ALL current
          # browsers. (And never --low-memory-unused: Rust keeps its shadow
          # stack at low memory.)
          wasm-opt -Oz --converge --generate-global-effects \
            --enable-mutable-globals --enable-sign-ext --enable-bulk-memory \
            --enable-nontrapping-float-to-int --enable-multivalue \
            --enable-reference-types --enable-extended-const \
            --enable-tail-call --enable-gc \
            --strip-producers --strip-target-features \
            --output _site/buoyancy/wasm_bg.wasm \
            _site/buoyancy/wasm_bg.wasm
          cp buoyancy/buoyancy.html _site/
          # The in-sim "how it works" page (top-left info link).
          cp buoyancy/info.html _site/buoyancy/
          # Uncompressed wasm size for the loading bar's denominator (same
          # rationale as loader-manifest.json above).
          echo "{ \"wasm_bytes\": $(stat -c%s _site/buoyancy/wasm_bg.wasm) }" > _site/buoyancy/manifest.json
          # Publish any committed archive builds (e.g. the playable Bevy 0.12
          # build under legacy/v0.12) verbatim alongside the current site.
          if [ -d legacy ]; then cp -r legacy _site/legacy; fi
          # Emit the loader manifest with *uncompressed* byte sizes so the
          # loading bar reports an honest percentage/ETA even when the assets
          # are served gzip/br-compressed (Content-Length would be the
          # compressed size). Keep the URLs in sync with index.html's RESOURCES.
          wasm_bytes=$(stat -c%s _site/target/wasm_bg.wasm)
          grass_bytes=$(stat -c%s _site/assets/textures/grass.png)
          cat > _site/loader-manifest.json <<EOF
          {
            "resources": [
              { "url": "./target/wasm_bg.wasm", "bytes": $wasm_bytes },
              { "url": "./assets/textures/grass.png", "bytes": $grass_bytes }
            ]
          }
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Enables Pages on first run if it's entirely off. NOTE: this does NOT
          # convert an existing "Deploy from a branch" site to the Actions source
          # — that one-time switch must be done by hand in Settings → Pages
          # (Source → "GitHub Actions"). Until it is, GitHub's legacy Jekyll
          # build of the repo root wins and serves README.md instead of this
          # artifact. See the Deployment section of CLAUDE.md.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub's Pages queue has been observed draining in 10-15 min while
          # this action's default timeout is 10 min — four consecutive runs
          # "failed" (and canceled their deployment) with the content going
          # live anyway. Give slow queue days room to finish.
          timeout: 1800000
