[package]
name = "bad-spaceship-shared"
version = "0.1.0"
authors = ["Sam Carey <sam@samcarey.com>"]
edition = "2021"
# Generates BS_PROTOCOL_ID / BS_VERSION from the git SHA (see build.rs); both the
# client and server inherit them through `shared` so the netcode protocol id matches.
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Version + base features come from `[workspace.dependencies]` in the root
# Cargo.toml (the single place engine versions are pinned — see that file for the
# 0.18-vs-0.19 rationale and the upgrade checklist).
bevy = { workspace = true }
# Avian (XPBD physics) replaces bevy_rapier3d. The workspace pin sets the base
# feature set `3d`/`f32`/`parry-f32`/`xpbd_joints`, chosen to keep the headless
# server and the wasm client off Avian's `debug-plugin` (which pulls `bevy_render`)
# and `parallel` (which pulls `multi_threaded`); `parry-f32` brings in the
# parry-backed `Collider`. `xpbd_joints` is a *default* Avian feature that gates the
# joint *solver* (`XpbdSolverPlugin`): without it the joint types (`SphericalJoint`,
# …) still compile and spawn, but nothing enforces them, so attached parts never
# move together — it must be re-added explicitly under `default-features = false`.
# The native binary and server re-add `simd`/`parallel` for perf via their own lists.
avian3d = { workspace = true }
# Multiplayer protocol lives in `shared` so client and server register the exact
# same components/messages/channels. `shared` only needs the protocol-building
# APIs (register_component / register_message / add_channel / InputPlugin) plus
# prediction/interpolation metadata — NOT the client or server runtime plugin
# groups (those are enabled in the client/server crates). Version is pinned in the
# root `[workspace.dependencies]`.
# `input_native` adds the message-based native-input framework (used to network
# `PlayerInput`); registered once in `ProtocolPlugin` (cfg-gated to the client or
# server input plugin per binary by lightyear's own `client`/`server` features).
lightyear = { workspace = true, features = ["replication", "prediction", "interpolation", "std", "input_native"] }
serde = { version = "1.0", features = ["derive"] }
ron = "0.7"
rand = "0.8"
include_dir = { version = "0.7" }
anyhow = "1.0"

[features]
# Avian (`default-features = false`) no longer pulls in the bevy features that
# bevy_rapier's defaults used to bring along transitively. `shared`'s player.rs
# spawns a `Camera3d` and reads `Tonemapping` (bevy_render / bevy_core_pipeline),
# so enable those here. `keyboard` / `mouse` (bevy_input's source features) are
# kept so the `KeyCode` / `MouseButton` types compile workspace-wide — the client
# (input.rs) and server consume them through `shared`; feature unification then
# carries them to every consumer regardless of who pulls in winit.
default = [
    "bevy/png",
    "bevy/bevy_render",
    "bevy/bevy_core_pipeline",
    "bevy/keyboard",
    "bevy/mouse",
]
