[package]
name = "bad-spaceship-shared"
version = "0.1.0"
authors = ["Sam Carey <sam@samcarey.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bevy = { version = "0.19", default-features = false }
# Avian (XPBD physics) replaces bevy_rapier3d. avian3d 0.7.0 is the release that
# targets Bevy 0.19 (parry3d 0.27 under the hood). `default-features = false` with
# just `3d`/`f32`/`parry-f32`/`xpbd_joints` keeps the headless server and the wasm
# client off Avian's `debug-plugin` (which pulls `bevy_render`) and `parallel`
# (which pulls `multi_threaded`); `parry-f32` brings in the parry-backed `Collider`.
# `xpbd_joints` is a *default* Avian feature that gates the joint *solver*
# (`XpbdSolverPlugin`): without it the joint types (`SphericalJoint`, …) still
# compile and spawn, but nothing enforces them, so attached parts never move
# together — it must be re-added explicitly under `default-features = false`. The
# native binary and server re-add `simd`/`parallel` for perf via their own lists.
avian3d = { version = "0.7.0", default-features = false, features = ["3d", "f32", "parry-f32", "xpbd_joints"] }
serde = { version = "1.0", features = ["derive"] }
ron = "0.7"
rand = "0.8"
include_dir = { version = "0.7" }
anyhow = "1.0"

[features]
# Avian (`default-features = false`) no longer pulls in the bevy features that
# bevy_rapier's defaults used to bring along transitively. `shared`'s player.rs
# spawns a `Camera3d` and reads `Tonemapping` (bevy_render / bevy_core_pipeline),
# so enable those here. `keyboard` / `mouse` (bevy_input's source features) are
# kept so the `KeyCode` / `MouseButton` types compile workspace-wide — the client
# (input.rs) and server consume them through `shared`; feature unification then
# carries them to every consumer regardless of who pulls in winit.
default = [
    "bevy/png",
    "bevy/bevy_render",
    "bevy/bevy_core_pipeline",
    "bevy/keyboard",
    "bevy/mouse",
]
